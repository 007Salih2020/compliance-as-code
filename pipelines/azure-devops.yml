trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
  - script: python -m pip install -e ".[dev]"
    displayName: Install dependencies
  - script: ruff check .
    displayName: Lint
  - script: pytest
    displayName: Unit tests
  - script: az bicep build --file infra/bicep/main.bicep
    displayName: Validate Bicep
  - script: |
      echo "Deploy infra and app in release stages with environment approvals."
    displayName: Deployment placeholder
